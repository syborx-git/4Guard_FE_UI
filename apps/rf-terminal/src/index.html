<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0E0E0D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>4GUARD RF Terminal</title>
    <meta name="description" content="4GUARD WMS RF Terminal — Operaciones de almacén offline-first." />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png" />

    <!-- ── Google Fonts: DM Sans + JetBrains Mono ─────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@500;700&display=swap"

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0..1,-50..200&display=block"
    />

    <style>
      body { background: #0E0E0D; margin: 0; touch-action: manipulation; }
    </style>
  </head>
  <body>
    <fg-rf-root id="rf-app-root">
      <div style="
        display:flex; align-items:center; justify-content:center;
        height:100vh; background:#060D17; flex-direction:column; gap:20px;
      ">
        <div style="
          width:64px; height:64px; background:#EAC349; border-radius:12px;
          display:flex; align-items:center; justify-content:center;
          font-family:'DM Sans',sans-serif; font-size:24px; font-weight:800;
          color:#0E0E0D;
        ">RF</div>
        <p style="
          font-family:'DM Sans',sans-serif; color:rgba(204,196,206,0.5);
          font-size:12px; letter-spacing:0.15em; text-transform:uppercase; margin:0;
