<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E0E0D" />

    <!-- SEO -->
    <title>4GUARD WMS — Admin Console</title>
    <meta name="description" content="4GUARD Warehouse Management System — Consola Administrativa 3PL. Gestión de inventario, recepciones, despachos y control de calidad." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- ── Google Fonts: Bodoni Moda + Playfair Display + Lobster + DM Sans ───── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;0,6..96,900;1,6..96,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lobster&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- ── Material Symbols Outlined ────────────────────────────── -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />

    <!-- Splash (fondo oscuro mientras carga) -->
    <style>
      body { background: #0E0E0D; margin: 0; }
      #app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 20px;
        background: #0E0E0D;
        font-family: 'DM Sans', sans-serif;
      }
      #app-loader-mark {
        width: 52px; height: 52px;
        background: #EAC349;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Bodoni Moda', serif;
        font-size: 20px; font-weight: 700;
        color: #0E0E0D;
        letter-spacing: 0.05em;
      }
      #app-loader-text {
        color: rgba(204, 196, 206, 0.5);
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <fg-admin-root id="admin-app-root">
      <div id="app-loader">
        <div id="app-loader-mark">4G</div>
        <span id="app-loader-text">4GUARD WMS — Admin Console</span>
      </div>
    </fg-admin-root>
  </body>
</html>
