<!-- apps/admin-console/src/app/shared/components/status-badge/status-badge.component.html -->
<span
  class="status-badge"
  [class]="statusClass"
  [attr.aria-label]="'Estado: ' + label"
  role="status">
  <span class="status-badge__dot" aria-hidden="true"></span>
  <span class="status-badge__label">{{ label }}</span>
</span>
