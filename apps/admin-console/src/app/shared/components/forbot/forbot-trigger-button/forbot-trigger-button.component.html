<div
  class="relative flex items-center justify-center transition-all duration-300"
  [class.opacity-0]="forbotEngine.isDrawerOpen()"
  [class.pointer-events-none]="forbotEngine.isDrawerOpen()"
  [class.scale-75]="forbotEngine.isDrawerOpen()"
>

  <!-- Tooltip Inteligente al Hover (Desplegado a la izquierda) -->
  <div class="absolute right-full mr-3 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 transform translate-x-2 group-hover:translate-x-0 whitespace-nowrap z-50">
    <div class="px-3.5 py-2 rounded-xl bg-slate-900/95 text-slate-100 border border-amber-400/40 shadow-[0_4px_20px_rgba(0,0,0,0.3)] text-xs font-bold flex items-center gap-2 font-sans backdrop-blur-md">
      <span class="text-amber-400">🤖 ForBot AI</span>
      <span class="text-slate-400 font-mono text-[10px] bg-slate-950 px-1.5 py-0.5 rounded border border-slate-700">Ctrl + K</span>
    </div>
  </div>

  <!-- Botón Flotante Circular Luminoso (FAB) 4GUARD -->
  <button
    type="button"
    (click)="onToggleForbot()"
    title="Abrir ForBot AI (Ctrl + K)"
    class="group relative w-14 h-14 sm:w-15 sm:h-15 rounded-full bg-white border-2 border-amber-400/60 hover:border-amber-400 shadow-[0_10px_30px_rgba(0,0,0,0.12),0_0_20px_rgba(217,160,48,0.35)] hover:shadow-[0_12px_36px_rgba(0,0,0,0.18),0_0_28px_rgba(217,160,48,0.55)] transition-all duration-300 transform hover:scale-105 active:scale-95 flex items-center justify-center cursor-pointer overflow-visible"
  >
    <!-- Halo exterior con pulso orbital Dorado / Ámbar -->
    <div class="absolute -inset-1 rounded-full bg-gradient-to-tr from-amber-400/30 via-amber-300/40 to-yellow-500/30 blur-md opacity-75 group-hover:opacity-100 animate-pulse pointer-events-none"></div>

    <!-- Anillo orbital exterior giratorio sutil -->
    <div class="absolute inset-0 rounded-full border border-dashed border-amber-400/50 group-hover:border-amber-500 animate-spin-slow pointer-events-none"></div>

    <!-- Imagen Oficial de ForBot AI en Fondo Blanco Nítido -->
    <div class="relative w-11 h-11 sm:w-12 sm:h-12 rounded-full overflow-hidden flex items-center justify-center bg-white p-0.5 shadow-inner">
      <img
        src="/assets/forbot-avatar.png"
        alt="ForBot AI"
        class="w-full h-full object-contain select-none"
      />
    </div>

    <!-- Punto Verde Neón de Estado Activo (Esquina inferior derecha) -->
    <span class="absolute bottom-0.5 right-0.5 flex h-3.5 w-3.5 z-10">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-80"></span>
      <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500 border-2 border-white shadow-[0_0_8px_rgba(16,185,129,0.9)]"></span>
    </span>

  </button>
</div>
