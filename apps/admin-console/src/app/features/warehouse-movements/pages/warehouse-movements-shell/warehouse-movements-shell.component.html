<div class="movements-shell-wrapper font-sans p-4 sm:p-6 space-y-6 max-w-7xl mx-auto">
  
  <!-- Header Principal Golden Standard (Hero Header) -->
  <header class="hero-header">
    <div class="hero-header__icon-box">
      <span class="material-symbols-outlined text-3xl">swap_horiz</span>
    </div>

    <div class="hero-header__content flex-1">
      <div class="hero-header__breadcrumb flex items-center gap-2 mb-1">
        <a routerLink="/admin" class="btn-back-admin" title="Regresar al Hub de Administración">
          <span class="back-arrow">←</span> ADMINISTRACIÓN WMS
        </a>
        <span class="breadcrumb-dot text-slate-400">·</span>
        <span class="hero-header__eyebrow uppercase text-xs font-bold tracking-wider">OPERACIÓN Y LOGÍSTICA</span>
      </div>

      <h1 class="hero-header__title text-2xl font-bold text-slate-100">Movimientos de Almacén</h1>
      <p class="hero-header__subtitle text-xs text-slate-400">
        Gestión unificada de Recepción de Mercancías (F01), Cambio de Almacén en ceros y Salidas Outbound FIFO/FEFO
      </p>
    </div>

    <!-- Pestañas Primarias del Módulo (Recepción | Cambio de Almacén | Salidas) -->
    <div class="primary-tabs-nav">
      <a
        routerLink="receiving"
        routerLinkActive="tab-active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="primary-tab-btn"
      >
        <span class="material-symbols-outlined text-base">move_to_inbox</span>
        <span>Recepción de Mercancía</span>
      </a>

      <a
        routerLink="transfers"
        routerLinkActive="tab-active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="primary-tab-btn"
      >
        <span class="material-symbols-outlined text-base">compare_arrows</span>
        <span>Cambio de Almacén</span>
      </a>

      <a
        routerLink="outbound"
        routerLinkActive="tab-active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="primary-tab-btn"
      >
        <span class="material-symbols-outlined text-base">local_shipping</span>
        <span>Salidas de Almacén</span>
      </a>
    </div>
  </header>

  <!-- Router Outlet de Submódulos -->
  <main class="movements-main-content">
    <router-outlet></router-outlet>
  </main>
</div>
