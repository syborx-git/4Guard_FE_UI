<!-- apps/admin-console/src/app/features/dashboard/dashboard.component.html -->
<div class="dashboard" id="dashboard-page">
  <header class="dashboard__header">
    <div>
      <h1 class="dashboard__title">Dashboard</h1>
      <p class="dashboard__subtitle">Resumen de inventario en tiempo real</p>
    </div>
  </header>

  <!-- KPI Cards -->
  <section class="dashboard__kpis" aria-label="Indicadores clave de inventario">
    @if (inventoryState.isLoading()) {
      @for (i of [1,2,3,4]; track i) {
        <div class="kpi-card kpi-card--skeleton" aria-busy="true"></div>
      }
    } @else {
      @for (kpi of kpiCards(); track kpi.status) {
        <article class="kpi-card" [attr.id]="'kpi-' + kpi.status">
          <div class="kpi-card__icon" aria-hidden="true">{{ kpi.icon }}</div>
          <div class="kpi-card__body">
            <span class="kpi-card__value">{{ kpi.value }}</span>
            <span class="kpi-card__label">{{ kpi.label }}</span>
          </div>
          <fg-status-badge [status]="kpi.status" />
        </article>
      }
    }
  </section>

  <!-- Error state -->
  @if (inventoryState.error()) {
    <div class="dashboard__error" role="alert">
      <span>⚠️ {{ inventoryState.error() }}</span>
    </div>
  }
</div>
