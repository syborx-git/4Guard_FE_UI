<!-- confirm-dialog.component.html -->
<!-- Diálogo de confirmación genérico y reutilizable — 4GUARD WMS -->
<div class="cd-backdrop" role="dialog" aria-modal="true" [attr.aria-labelledby]="'cd-title'">
  <div class="cd-card" [class.cd-card--danger]="variant() === 'danger'" tabindex="-1">

    <!-- Icono de advertencia o peligro -->
    <div class="cd-icon-wrap" [class.cd-icon-wrap--danger]="variant() === 'danger'">
      <span class="material-symbols-outlined cd-icon">{{ icon() }}</span>
    </div>

    <!-- Contenido -->
    <div class="cd-body">
      <h2 id="cd-title" class="cd-title">{{ title() }}</h2>
      <p class="cd-message">{{ message() }}</p>
    </div>

    <!-- Acciones -->
    <div class="cd-actions">

      <!-- Cancelar — deshabilitado en loading -->
      <button
        id="cd-cancel-btn"
        type="button"
        class="cd-btn cd-btn--secondary"
        [disabled]="isLoading()"
        (click)="onCancel()">
        Cancelar
      </button>

      <!-- Confirmar — muestra spinner en loading -->
      <button
        id="cd-confirm-btn"
        type="button"
        class="cd-btn"
        [class.cd-btn--primary]="variant() === 'primary'"
        [class.cd-btn--danger]="variant() === 'danger'"
        [disabled]="isLoading()"
        (click)="onConfirm()">
        @if (isLoading()) {
          <span class="cd-spinner" aria-hidden="true"></span>
          <span>Procesando...</span>
        } @else {
          <span class="cd-btn-text">{{ confirmLabel() }}</span>
        }
      </button>

    </div>
  </div>
</div>
