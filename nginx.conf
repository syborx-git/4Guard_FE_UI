# Configuración optimizada para mínimo uso de RAM (< 20MB)
worker_processes 1;
worker_rlimit_nofile 1024;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimización de I/O y buffers reducidos para ahorrar RAM
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    client_max_body_size 10M;

    # Compresión gzip ligera
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Resolver DNS para resolución dinámica de endpoints HTTPS externos
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ─────────────────────────────────────────────────────────────
    # 1. SERVIDOR ADMIN CONSOLE (Puerto 8080 interno)
    # ─────────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html/admin-console;
        index index.html;

        # Proxy inverso para peticiones de API al Backend Spring Boot
        location /api/v1/ {
            proxy_pass http://4guard-backend:8080/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Cache control para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # SPA fallback — Angular routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ─────────────────────────────────────────────────────────────
    # 2. SERVIDOR RF TERMINAL / TABLET (Puerto 8081 interno)
    # ─────────────────────────────────────────────────────────────
    server {
        listen 8081;
        server_name _;

        root /usr/share/nginx/html/rf-terminal;
        index index.html;

        # Proxy inverso para peticiones de API al Backend Spring Boot
        location /api/v1/ {
            proxy_pass http://4guard-backend:8080/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Soporte PWA (Service Worker y Manifest sin cache agresivo)
        location ~* (ngsw-worker\.js|ngsw\.json|manifest\.webmanifest)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # Cache control para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # SPA fallback — Angular routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
