# netlify.toml
# Configuración de despliegue automático para 4GUARD WMS — Admin Console
# Rama: main  →  https://fourguard-be.onrender.com (entorno develop)

[build]
  # Si APP_TARGET=rf compila la Terminal RF (Tablet); de lo contrario compila Admin Console (Web)
  command = "if [ \"$APP_TARGET\" = \"rf\" ]; then npm run build:rf:dev && mkdir -p dist/publish && cp -r dist/rf-terminal/browser/. dist/publish/; else npm run build:admin:dev && mkdir -p dist/publish && cp -r dist/admin-console/browser/. dist/publish/; fi"
  # Directorio unificado de publicación
  publish = "dist/publish"


[build.environment]
  # Fijar versión de Node.js compatible con Angular 17
  NODE_VERSION = "20"

# Proxy inverso para peticiones de API al Backend en Render
[[redirects]]
  from   = "/api/v1/*"
  to     = "https://fourguard-be-huzh.onrender.com/api/v1/:splat"
  status = 200
  force  = true

# Redirigir todas las rutas al index.html para que funcione el routing de Angular (SPA)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
