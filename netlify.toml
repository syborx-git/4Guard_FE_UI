# netlify.toml
# Configuración global para 4GUARD WMS (Admin Console y Terminal RF)
# Los comandos de build y publish se configuran en el panel de Netlify por cada sitio.


[build.environment]
  # Fijar versión de Node.js compatible con Angular 17
  NODE_VERSION = "20"

# Proxy inverso para peticiones de API al Backend en Render
[[redirects]]
  from   = "/api/v1/*"
  to     = "https://fourguard-be-huzh.onrender.com/api/v1/:splat"
  status = 200
  force  = true

# Redirigir todas las rutas al index.html para que funcione el routing de Angular (SPA)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
