# netlify.toml
# Configuración de despliegue automático para 4GUARD WMS — Admin Console
# Rama: main  →  https://fourguard-be.onrender.com (entorno develop)

[build]
  # Comando de instalación explícito: hereda legacy-peer-deps del .npmrc
  command = "npm run build:admin:dev"
  # Directorio de salida del build de Angular
  publish = "dist/admin-console/browser"

[build.environment]
  # Fijar versión de Node.js compatible con Angular 17
  NODE_VERSION = "20"

# Proxy inverso para peticiones de API al Backend en Render
[[redirects]]
  from   = "/api/v1/*"
  to     = "https://fourguard-be-huzh.onrender.com/api/v1/:splat"
  status = 200
  force  = true

# Redirigir todas las rutas al index.html para que funcione el routing de Angular (SPA)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
